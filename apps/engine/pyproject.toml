[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarobill-engine"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.12.5",
    "pydantic-settings>=2.7.0,<3.0.0",
    "supabase==2.28.3",
    "anthropic==0.40.0",
    "google-cloud-vision==3.9.0",
    "google-cloud-bigquery==3.25.0",
    "google-cloud-storage==2.18.2",
    "google-cloud-aiplatform==1.91.0",
    "httpx>=0.27,<0.29",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.3.0",
    "fpdf2==2.8.2",
    "sendgrid==6.11.0",
    "slowapi==0.1.9",
    "sentry-sdk[fastapi]==2.22.0",
    "python-docx==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.13.0",
    "ruff==0.8.4",
    "types-python-jose==3.3.4.20240106",
]

[tool.ruff]
# 120 is the modern Python default (FastAPI, Pydantic, Django convention).
# We'd been drifting past 100 anyway — codify the actual norm rather than
# leave 50+ legitimate violations unchecked. Tighten back if it starts to
# erode readability in code review.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "PT"]
ignore = ["ANN101", "ANN102"]

# FastAPI's prescribed pattern — Depends(...) and Query(...) etc. in argument
# defaults — looks like a B008 (function-call-in-default-argument) violation
# but it's the documented way to declare dependencies. Whitelist them so B008
# can still flag genuine misuse elsewhere.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# email_service.py contains HTML email templates — inline styles must live on
# a single attribute string, so breaking lines mid-CSS is impractical.
"app/services/email_service.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Third-party libraries that ship without py.typed markers or type stubs.
# These packages are stable and type-checking their internals adds no value;
# silencing the import-untyped warning lets us keep --strict on our own code.
[[tool.mypy.overrides]]
module = [
    "vertexai",
    "vertexai.*",
    "sendgrid",
    "sendgrid.*",
    "matplotlib",
    "matplotlib.*",
    "docx",
    "docx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
