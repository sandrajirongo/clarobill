name: Migration check

# Runs ONLY on PRs that touch supabase/migrations/. Spins up a local Postgres
# via the Supabase CLI's Docker stack, applies every migration in order,
# and asserts the new ones are idempotent + reversible.
#
# Without this, a broken migration would only surface when Sandra runs
# `supabase db push` against pre-prod or prod — too late.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-check.yml"

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    name: Apply, verify, reverse migrations
    runs-on: ubuntu-latest

    # Pull the base branch ref into a static env var rather than inlining
    # ${{ github.base_ref }} into shell scripts. Even though base_ref is
    # GitHub-controlled in practice, the `env:` form keeps the workflow
    # injection-safe against any future trigger that exposes attacker-
    # controlled refs.
    env:
      BASE_REF: ${{ github.base_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to diff against the base branch.
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Boot local Supabase stack
        # `supabase db start` runs Postgres + Auth + Storage in Docker on
        # port 54322. Migrations under supabase/migrations/ are applied
        # automatically in lexicographic order.
        run: supabase db start

      - name: Verify all migrations applied cleanly
        # If any migration's postcondition (e.g. the `do $$ ... $$` block in
        # 20260504000023) failed, supabase db start would have exited non-zero.
        # This step is a belt-and-braces sanity check that the DB is in the
        # expected post-migration state.
        env:
          PGPASSWORD: postgres
        run: |
          count=$(psql -h localhost -p 54322 -U postgres -d postgres -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public';")
          echo "public schema has $count tables"
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected at least 5 tables in public schema after migrations; got $count"
            exit 1
          fi

      - name: Test reversibility of changed migrations
        # For every up-migration touched in this PR, run its sibling
        # supabase/migrations_down/<version>_<name>.down.sql AND re-apply the up.
        # Down migrations live in a sibling folder rather than alongside the
        # ups so the Supabase CLI doesn't treat them as additional migrations
        # to apply (the CLI scans only supabase/migrations/).
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- supabase/migrations/ \
            | grep '\.sql$' || true)
          if [ -z "$changed" ]; then
            echo "No new up-migrations in this PR — skipping reversibility test."
            exit 0
          fi
          for migration in $changed; do
            filename=$(basename "$migration" .sql)
            down="supabase/migrations_down/${filename}.down.sql"
            if [ ! -f "$down" ]; then
              echo "::warning::No down migration for $migration at $down — skipping reversibility check. Add one if the migration is reversible."
              continue
            fi
            echo "Testing reversibility of $migration via $down"
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$down"
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Set up Python 3.11
        # Run engine pytest against the live local DB to catch any code that
        # depends on the schema and would silently fail in prod after a
        # schema change.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/engine/pyproject.toml

      - name: Install engine
        run: cd apps/engine && pip install -e ".[dev]"

      - name: Pytest with live DB
        run: cd apps/engine && python -m pytest tests/ -v
        env:
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-key"
          ANTHROPIC_API_KEY: "ci-placeholder-key"
          SENDGRID_API_KEY: "ci-placeholder-key"
          SENDGRID_FROM_EMAIL: "ci@clarobill.com"

      - name: Tear down local DB
        if: always()
        run: supabase db stop
