# Cloud Build config for the MRF pipeline images.
#
# Triggered automatically on push to main when pipeline/** or
# scripts/mrf_discovery/** changes. Also invoked by deploy.sh for
# manual full-deploy (which additionally updates Scheduler + IAM).
#
# Build context must be repo root because Dockerfile.discovery COPYs
# from both pipeline/ and scripts/mrf_discovery/.

steps:
  # Build the weekly scraper/parser image (mrf-pipeline)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=pipeline/Dockerfile
      - "--tag=${_IMAGE}:$COMMIT_SHA"
      - "--tag=${_IMAGE}:latest"
      - .

  # Build the discovery pipeline image (mrf-discovery)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=pipeline/Dockerfile.discovery
      - "--tag=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - "--tag=${_DISCOVERY_IMAGE}:latest"
      - .

  # Push all tags for both images
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_IMAGE}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_DISCOVERY_IMAGE}

  # Update all discovery Cloud Run Jobs to the new commit-SHA image.
  # Pinning to commit SHA (not :latest) so each execution is traceable
  # to the exact source commit — same pattern as the engine trigger.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-discovery-stage4
      - "--image=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-discovery-stage3
      - "--image=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-discovery-stage2
      - "--image=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-discovery-stage1
      - "--image=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-discovery-annual
      - "--image=${_DISCOVERY_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  # Update scraper and parser jobs to the new mrf-pipeline image
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-scraper
      - "--image=${_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - clarobill-mrf-parser
      - "--image=${_IMAGE}:$COMMIT_SHA"
      - --region=us-central1
      - --project=clarobill-prd
      - --quiet

images:
  - ${_IMAGE}:$COMMIT_SHA
  - "${_IMAGE}:latest"
  - ${_DISCOVERY_IMAGE}:$COMMIT_SHA
  - "${_DISCOVERY_IMAGE}:latest"

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/clarobill-prd/clarobill-pipeline/mrf-pipeline
  _DISCOVERY_IMAGE: us-central1-docker.pkg.dev/clarobill-prd/clarobill-pipeline/mrf-discovery

options:
  logging: CLOUD_LOGGING_ONLY
